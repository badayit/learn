<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@500&family=Noto+Sans+Arabic:wght@600&display=swap">
<style>
/* Google Play feature graphic, 1024x500. Rendered to store/feature-graphic-1024x500.png */
body{margin:0;width:1024px;height:500px;overflow:hidden;background:#0B4EA2;color:#fff;font-family:Barlow,sans-serif;position:relative}
.road{position:absolute;right:-60px;top:0;bottom:0;width:520px;background:#0A3F86;clip-path:polygon(32% 0,68% 0,100% 100%,0 100%)}
.road::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:12px;margin-left:-6px;background:repeating-linear-gradient(#F6C400 0 46px,transparent 46px 86px)}
.left{position:absolute;left:64px;top:70px;width:560px;display:grid;gap:18px}
.brand{display:flex;align-items:center;gap:20px}
.brand svg{width:96px;height:96px;border-radius:22px}
h1{font:700 76px/0.95 "Barlow Condensed",sans-serif;margin:0;text-transform:uppercase;letter-spacing:.01em}
.tag{font:600 30px/1.2 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.03em;color:#DCE7F7}
.ar{font:600 30px/1.4 "Noto Sans Arabic",sans-serif;direction:rtl;text-align:left}
.chips{display:flex;gap:10px;flex-wrap:wrap}.chips span{background:#fff;color:#0B4EA2;border-radius:99px;padding:6px 14px;font:700 20px "Barlow Condensed",sans-serif;text-transform:uppercase}
.signs{position:absolute;right:70px;top:60px;display:grid;gap:22px}
.signs svg{width:118px;height:118px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.signs svg:nth-child(2){margin-left:-120px}
</style></head><body>
<div class="road"></div>
<div class="left">
  <div class="brand"><svg viewBox="0 0 108 108"><rect width="108" height="108" fill="#0A3F86"/><path d="M54 21.5 L86.5 54 L54 86.5 L21.5 54 Z" fill="#fff" stroke="#111" stroke-width="1.5"/><path d="M54 34.2 L73.8 54 L54 73.8 L34.2 54 Z" fill="#F6C400"/></svg><h1>Patente<br>Facile</h1></div>
  <div class="tag">Quiz patente B · Corsi con audio</div>
  <div class="ar">تعلّم البيرمي ديال إيطاليا بالعربية</div>
  <div class="chips"><span>Vero / Falso</span><span>30 domande · 20 min</span><span>Offline</span></div>
</div>
<div class="signs">
  <svg viewBox="0 0 100 100"><polygon points="30,2 70,2 98,30 98,70 70,98 30,98 2,70 2,30" fill="#fff"/><polygon points="31,6 69,6 94,31 94,69 69,94 31,94 6,69 6,31" fill="#C8102E"/><text x="50" y="60" text-anchor="middle" font-family="Arial" font-weight="700" font-size="27" fill="#fff">STOP</text></svg>
  <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="#C8102E"/><circle cx="50" cy="50" r="36" fill="#fff"/><text x="50" y="63" text-anchor="middle" font-family="Arial" font-weight="700" font-size="38" fill="#111">50</text></svg>
  <svg viewBox="0 0 100 100"><path d="M50 5 L96 88 Q97 92 92 92 H8 Q3 92 4 88 Z" fill="#C8102E"/><path d="M50 22 L82 80 H18 Z" fill="#fff"/><rect x="46" y="38" width="8" height="24" rx="2" fill="#111"/><circle cx="50" cy="70" r="4.5" fill="#111"/></svg>
</div>
</body></html>
